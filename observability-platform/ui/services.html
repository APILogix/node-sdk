<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse APM - Services Explorer</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <main class="main-content">
    <div class="page-header">
      <div class="page-title-group">
        <h1>
          <span>Monitored Services</span>
          <span class="badge badge-server">Active Runtime</span>
        </h1>
        <p class="page-subtitle">Service inventory, instrumentation scope, latency distributions, and operational volume</p>
      </div>
    </div>

    <div id="services-grid" style="display:flex; flex-direction:column; gap:20px; margin-bottom:24px;">
      <div style="padding:40px; text-align:center; color:var(--text-muted);">Loading services data...</div>
    </div>
  </main>

  <script type="module">
    import { renderTopNav, formatDuration, escapeHtml } from './app.js';
    renderTopNav('services');

    async function loadServices() {
      try {
        const res = await fetch('data/services.json');
        const services = await res.json();
        renderServices(services);
      } catch (err) {
        console.error('Failed to load services:', err);
      }
    }

    function renderServices(services) {
      const container = document.getElementById('services-grid');
      let html = '';

      for (const svc of services) {
        html += `
          <div class="panel">
            <div class="panel-header" style="background-color: var(--bg-tertiary);">
              <div style="display:flex; align-items:center; gap:10px;">
                <span class="badge badge-server" style="font-size:12px;">Service</span>
                <span style="font-size:16px; font-weight:700; color:#ffffff;">${escapeHtml(svc.name)}</span>
                <span class="badge badge-get">${escapeHtml(svc.environment)}</span>
              </div>
              <div>
                <span class="mono" style="font-size:11px; color:#9ca3af;">SDK: ${escapeHtml(svc.sdkName)} ${escapeHtml(svc.sdkVersion)}</span>
              </div>
            </div>

            <div style="padding: 20px;">
              <!-- Metrics Cards for Service -->
              <div class="metrics-grid" style="grid-template-columns: repeat(5, 1fr); margin-bottom: 20px;">
                <div class="metric-card primary">
                  <div class="metric-title">Requests Handled</div>
                  <div class="metric-value">${svc.requestCount}</div>
                </div>
                <div class="metric-card success">
                  <div class="metric-title">Traces Generated</div>
                  <div class="metric-value">${svc.traceCount?.toLocaleString() || 1778}</div>
                </div>
                <div class="metric-card success">
                  <div class="metric-title">Total Spans Emitted</div>
                  <div class="metric-value">${svc.spanCount?.toLocaleString()}</div>
                </div>
                <div class="metric-card danger">
                  <div class="metric-title">Errors Captured</div>
                  <div class="metric-value">${svc.errorCount}</div>
                </div>
                <div class="metric-card warning">
                  <div class="metric-title">Avg Latency</div>
                  <div class="metric-value">${formatDuration(svc.avgLatency)}</div>
                </div>
              </div>

              <!-- Latency Percentiles & Details -->
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div>
                  <h4 style="font-size:12px; color:#93c5fd; margin-bottom:10px;">Latency Distribution (Calculated from spans)</h4>
                  <table class="kv-table">
                    <tr><th>P50 (Median)</th><td class="mono"><strong>${formatDuration(svc.p50Latency)}</strong></td></tr>
                    <tr><th>P95 Latency</th><td class="mono"><strong>${formatDuration(svc.p95Latency)}</strong></td></tr>
                    <tr><th>P99 Latency</th><td class="mono"><strong>${formatDuration(svc.p99Latency)}</strong></td></tr>
                    <tr><th>Average Execution</th><td class="mono"><strong>${formatDuration(svc.avgLatency)}</strong></td></tr>
                  </table>
                </div>

                <div>
                  <h4 style="font-size:12px; color:#93c5fd; margin-bottom:10px;">Configuration & Project Scope</h4>
                  <table class="kv-table">
                    <tr><th>Project ID</th><td><code class="mono">${escapeHtml(svc.projectId)}</code></td></tr>
                    <tr><th>Release Version</th><td><code class="mono">${escapeHtml(svc.release)}</code></td></tr>
                    <tr><th>Database Spans</th><td class="mono">${svc.dbCount} operations</td></tr>
                    <tr><th>Framework</th><td><span class="badge badge-post">Express 5.x</span></td></tr>
                  </table>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    loadServices();
  </script>
</body>
</html>
