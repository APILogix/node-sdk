<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse APM - Structured Logs Explorer</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <main class="main-content">
    <div class="page-header">
      <div class="page-title-group">
        <h1>
          <span>Structured Logs Stream</span>
          <span class="badge badge-error" id="total-logs-count">2 Log Events</span>
        </h1>
        <p class="page-subtitle">Telemetry logs captured by SDK logging subsystem and intercepted from application runtime</p>
      </div>
      <div class="filter-bar">
        <input type="text" id="log-filter-search" class="filter-input" placeholder="Search message text, trace ID..." style="width:260px;">
        <select id="log-filter-level" class="filter-select">
          <option value="">All Levels</option>
          <option value="error">ERROR</option>
          <option value="warn">WARN</option>
          <option value="info">INFO</option>
          <option value="debug">DEBUG</option>
        </select>
      </div>
    </div>

    <div class="panel">
      <div class="table-responsive">
        <table class="data-table" id="logs-table">
          <thead>
            <tr>
              <th style="width: 140px;">Timestamp</th>
              <th style="width: 90px;">Level</th>
              <th>Message</th>
              <th style="width: 170px;">Trace ID</th>
              <th style="width: 150px;">Span ID</th>
              <th style="width: 160px;">Request ID</th>
              <th style="width: 90px;">Details</th>
            </tr>
          </thead>
          <tbody id="logs-tbody">
            <tr><td colspan="7" style="text-align:center;">Loading logs...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderTopNav, formatTime, escapeHtml } from './app.js';
    renderTopNav('logs');

    let allLogs = [];
    let expandedLogId = null;

    async function loadLogs() {
      try {
        const res = await fetch('data/logs.json');
        allLogs = await res.json();
        renderLogs();
      } catch (err) {
        console.error('Failed to load logs:', err);
      }
    }

    function renderLogs() {
      const q = document.getElementById('log-filter-search').value.trim().toLowerCase();
      const level = document.getElementById('log-filter-level').value;

      const filtered = allLogs.filter(l => {
        if (level && l.level !== level) return false;
        if (q) {
          const text = `${l.message} ${l.traceId} ${l.spanId} ${l.requestId}`.toLowerCase();
          if (!text.includes(q)) return false;
        }
        return true;
      });

      document.getElementById('total-logs-count').innerText = `${filtered.length} of ${allLogs.length} Log Events`;

      const tbody = document.getElementById('logs-tbody');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:24px; color:#9ca3af;">No logs match the current search</td></tr>`;
        return;
      }

      let html = '';
      for (const log of filtered) {
        const isExpanded = (expandedLogId === log.eventId);
        html += `
          <tr>
            <td class="mono" style="font-size:11px;">${formatTime(log.timestamp)}</td>
            <td><span class="badge badge-error" style="text-transform:uppercase;">${log.level}</span></td>
            <td>
              <div style="font-family:var(--font-mono); font-size:11px; color:#f3f4f6; max-height:45px; overflow:hidden; text-overflow:ellipsis;">
                ${escapeHtml(log.message.slice(0, 180))}...
              </div>
            </td>
            <td class="mono" style="font-size:11px;">
              <a href="trace-detail.html?traceId=${log.traceId}" style="color:#60a5fa; font-weight:600;">
                ${log.traceId?.slice(0, 12)}... ↗
              </a>
            </td>
            <td class="mono" style="font-size:11px;">
              <code>${log.spanId?.slice(0, 10)}...</code>
            </td>
            <td class="mono" style="font-size:11px;">
              <span>${log.requestId?.slice(0, 10)}...</span>
            </td>
            <td>
              <button class="btn btn-secondary" style="padding:2px 6px; font-size:10px;" onclick="window.toggleLogDetails('${log.eventId}')">
                ${isExpanded ? 'Hide' : 'Inspect'}
              </button>
            </td>
          </tr>
        `;

        if (isExpanded) {
          html += `
            <tr style="background-color: var(--bg-tertiary);">
              <td colspan="7" style="padding: 16px;">
                <div style="margin-bottom:8px; font-weight:600; color:#93c5fd; font-size:12px;">Full Log Message</div>
                <pre class="code-block" style="color:#fca5a5; margin-bottom:12px;">${escapeHtml(log.message)}</pre>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                  <table class="kv-table">
                    <tr><th>Event ID</th><td><code class="mono">${log.eventId}</code></td></tr>
                    <tr><th>Trace Link</th><td><a href="trace-detail.html?traceId=${log.traceId}" class="mono">${log.traceId}</a></td></tr>
                    <tr><th>Span ID</th><td><code class="mono">${log.spanId}</code></td></tr>
                    <tr><th>Request ID</th><td><code class="mono">${log.requestId}</code></td></tr>
                  </table>
                  <table class="kv-table">
                    <tr><th>Session ID</th><td><code class="mono">${log.sessionId}</code></td></tr>
                    <tr><th>Tags</th><td><code>${JSON.stringify(log.tags)}</code></td></tr>
                    <tr><th>Extra Metadata</th><td><code>${JSON.stringify(log.extra)}</code></td></tr>
                    <tr><th>Raw Provenance</th><td><code class="mono">${log._provenance.relativePath}</code></td></tr>
                  </table>
                </div>
              </td>
            </tr>
          `;
        }
      }

      tbody.innerHTML = html;
    }

    window.toggleLogDetails = (id) => {
      expandedLogId = (expandedLogId === id) ? null : id;
      renderLogs();
    };

    document.getElementById('log-filter-search').addEventListener('input', renderLogs);
    document.getElementById('log-filter-level').addEventListener('change', renderLogs);

    loadLogs();
  </script>
</body>
</html>
