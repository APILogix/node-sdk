<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse APM - Errors Explorer</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <main class="main-content">
    <div class="page-header">
      <div class="page-title-group">
        <h1>
          <span>Errors & Exceptions Explorer</span>
          <span class="badge badge-error" id="total-error-count">3 Occurrences</span>
        </h1>
        <p class="page-subtitle">Track handled application warnings, unhandled exceptions, and fatal process terminations</p>
      </div>
      <div>
        <span class="badge badge-server">Grouped by Fingerprint & Type</span>
      </div>
    </div>

    <!-- Error Groups Overview -->
    <div id="error-groups-list" style="display:flex; flex-direction:column; gap:16px; margin-bottom:24px;">
      <div style="padding:40px; text-align:center; color:var(--text-muted);">Loading error records...</div>
    </div>
  </main>

  <script type="module">
    import { renderTopNav, formatTime, escapeHtml, copyToClipboard } from './app.js';
    renderTopNav('errors');

    async function loadErrors() {
      try {
        const res = await fetch('data/errors.json');
        const data = await res.json();
        renderErrorGroups(data.errorGroups, data.errors);
      } catch (err) {
        console.error('Failed to load errors:', err);
      }
    }

    function renderErrorGroups(groups, errors) {
      document.getElementById('total-error-count').innerText = `${errors.length} Occurrences (${groups.length} Groups)`;
      const container = document.getElementById('error-groups-list');

      let html = '';
      for (const group of groups) {
        const isFatal = group.severity === 'fatal' || group.occurrences.some(o => o.classification?.fatal);
        const firstOcc = group.occurrences[0];

        html += `
          <div class="panel" style="border-left: 4px solid ${isFatal ? '#ef4444' : '#f59e0b'};">
            <div class="panel-header" style="background-color: var(--bg-tertiary);">
              <div style="display:flex; align-items:center; gap:10px;">
                <span class="badge ${isFatal ? 'badge-error' : 'badge-4xx'}">${isFatal ? 'FATAL CRASH' : 'HANDLED WARNING'}</span>
                <span style="font-size:15px; font-weight:700; color:#fff;">${escapeHtml(group.name)}</span>
                <span class="badge badge-server">${group.count} ${group.count === 1 ? 'event' : 'events'}</span>
              </div>
              <div class="mono" style="font-size:11px; color:var(--text-muted);">
                First seen: ${formatTime(group.firstSeen)} | Last seen: ${formatTime(group.lastSeen)}
              </div>
            </div>

            <div style="padding: 16px 20px;">
              <!-- Error Message Header -->
              <div style="font-size:13px; font-weight:600; color:#fca5a5; font-family:var(--font-mono); margin-bottom:14px; white-space:pre-wrap; background:#221010; padding:12px; border-radius:4px; border:1px solid #7f1d1d;">
                ${escapeHtml(group.message)}
              </div>

              <!-- Occurrences list with Trace/Request correlation -->
              <div style="margin-bottom:16px;">
                <div style="font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; margin-bottom:8px;">
                  Correlated Occurrences (${group.occurrences.length})
                </div>
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Time</th>
                      <th>Event ID</th>
                      <th>Route / URL</th>
                      <th>Mechanism</th>
                      <th>Handled</th>
                      <th>Trace Link</th>
                      <th>Span ID</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${group.occurrences.map(occ => `
                      <tr>
                        <td class="mono" style="font-size:11px;">${formatTime(occ.timestamp)}</td>
                        <td><code class="mono" style="color:#93c5fd;">${occ.eventId.slice(0, 13)}...</code></td>
                        <td>
                          ${occ.route ? `<strong>${occ.method || 'POST'} ${escapeHtml(occ.route)}</strong>` : '<span class="text-muted">Process Level (uncaught)</span>'}
                        </td>
                        <td><span class="badge badge-internal">${occ.mechanism}</span></td>
                        <td><span class="badge ${occ.handled ? 'badge-2xx' : 'badge-error'}">${occ.handled ? 'true' : 'false'}</span></td>
                        <td>
                          <a href="trace-detail.html?traceId=${occ.traceId}" class="mono" style="font-weight:600;">
                            ${occ.traceId?.slice(0, 10)}... ↗
                          </a>
                        </td>
                        <td class="mono" style="font-size:11px;">
                          ${occ.spanId ? `<code>${occ.spanId}</code>` : '<span class="text-muted">None</span>'}
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>

              <!-- Stack Trace Viewer -->
              <div>
                <div style="font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; margin-bottom:8px;">
                  Stack Trace Frames (${Array.isArray(firstOcc.stack) ? firstOcc.stack.length : 0} frames)
                </div>
                <div class="stack-trace">
                  ${Array.isArray(firstOcc.stack) && firstOcc.stack.length > 0 ? firstOcc.stack.map(frame => `
                    <div class="stack-frame ${frame.inApp ? 'in-app' : ''}">
                      at <strong>${escapeHtml(frame.function || '<anonymous>')}</strong>
                      (<span style="color:#93c5fd;">${escapeHtml(frame.filename || 'unknown')}</span>:${frame.lineno}:${frame.colno})
                      ${frame.inApp ? '<span class="badge badge-error" style="font-size:9px; margin-left:6px;">inApp</span>' : ''}
                    </div>
                  `).join('') : `
                    <div class="text-muted">${escapeHtml(firstOcc.rawStack || 'No stack trace captured for this event')}</div>
                  `}
                </div>
              </div>

              <!-- Provenance footer -->
              <div style="margin-top:12px; font-size:11px; color:var(--text-muted);">
                Raw Provenance: <code class="mono">${escapeHtml(firstOcc._provenance.relativePath)}</code> (${firstOcc._provenance.sizeBytes} B)
              </div>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    loadErrors();
  </script>
</body>
</html>
