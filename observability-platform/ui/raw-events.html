<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse APM - Raw Event Stream & Provenance Inspector</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <main class="main-content">
    <div class="page-header">
      <div class="page-title-group">
        <h1>
          <span>Raw Event Stream & Provenance</span>
          <span class="badge badge-server" id="total-raw-count">4,219 Files</span>
        </h1>
        <p class="page-subtitle">Direct access to every raw SDK event file, captured batch, and serialized JSON payload</p>
      </div>
      <div class="filter-bar">
        <input type="text" id="raw-filter-search" class="filter-input" placeholder="Search filename, eventId, traceId..." style="width:280px;">
        <select id="raw-filter-cat" class="filter-select">
          <option value="">All Categories (4,219)</option>
          <option value="raw_batches">raw_batches (253)</option>
          <option value="spans">spans (2,106)</option>
          <option value="traces">traces (1,836)</option>
          <option value="requests">requests (16)</option>
          <option value="errors">errors (3)</option>
          <option value="logs">logs (2)</option>
          <option value="init">init (3)</option>
        </select>
      </div>
    </div>

    <div class="panel">
      <div class="table-responsive">
        <table class="data-table" id="raw-table">
          <thead>
            <tr>
              <th style="width: 120px;">Category</th>
              <th>Source File Relative Path</th>
              <th style="width: 90px;">Size</th>
              <th style="width: 180px;">Event ID</th>
              <th style="width: 180px;">Trace ID</th>
              <th style="width: 140px;">Span ID</th>
              <th style="width: 90px;">Action</th>
            </tr>
          </thead>
          <tbody id="raw-tbody">
            <tr><td colspan="7" style="text-align:center;">Loading raw event catalog...</td></tr>
          </tbody>
        </table>
      </div>
      <!-- Pagination Controls -->
      <div class="panel-header" style="border-top:1px solid var(--border-subtle); border-bottom:none;">
        <span id="raw-page-indicator" style="font-size:12px; color:var(--text-secondary);">Showing 1-50 of 4,219</span>
        <div style="display:flex; gap:6px;">
          <button id="btn-raw-prev" class="btn btn-secondary" style="padding:3px 10px; font-size:11px;">Previous</button>
          <button id="btn-raw-next" class="btn btn-secondary" style="padding:3px 10px; font-size:11px;">Next</button>
        </div>
      </div>
    </div>

    <!-- Raw Modal Viewer -->
    <div id="raw-modal-backdrop" class="drawer-backdrop"></div>
    <div id="raw-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:750px; max-width:92vw; max-height:85vh; background:var(--bg-secondary); border:1px solid var(--border-normal); border-radius:var(--radius-md); box-shadow:var(--shadow-lg); z-index:1300; flex-direction:column;">
      <div class="panel-header">
        <div>
          <span style="font-size:13px; font-weight:700; color:#fff;" id="modal-filename">File Details</span>
          <div style="font-size:11px; color:#9ca3af;" id="modal-path"></div>
        </div>
        <button id="btn-close-modal" class="drawer-close">&times;</button>
      </div>
      <div style="padding:16px; overflow-y:auto; flex:1;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span style="font-size:11px; color:#9ca3af;">File Payload Content</span>
          <button class="copy-btn" id="btn-copy-modal">Copy JSON</button>
        </div>
        <pre class="code-block" id="modal-payload" style="max-height:450px;"></pre>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderTopNav, escapeHtml, copyToClipboard } from './app.js';
    renderTopNav('raw-events');

    let allManifest = [];
    let currentPage = 1;
    const pageSize = 50;

    async function loadManifest() {
      try {
        const res = await fetch('data/raw_events_manifest.json');
        allManifest = await res.json();
        renderManifest();
      } catch (err) {
        console.error('Failed to load raw events manifest:', err);
      }
    }

    function getFiltered() {
      const q = document.getElementById('raw-filter-search').value.trim().toLowerCase();
      const cat = document.getElementById('raw-filter-cat').value;

      return allManifest.filter(item => {
        if (cat && item.category !== cat) return false;
        if (q) {
          const text = `${item.filename} ${item.relativePath} ${item.eventId || ''} ${item.traceId || ''} ${item.spanId || ''}`.toLowerCase();
          if (!text.includes(q)) return false;
        }
        return true;
      });
    }

    function renderManifest() {
      const filtered = getFiltered();
      const total = filtered.length;
      const totalPages = Math.ceil(total / pageSize) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIdx = (currentPage - 1) * pageSize;
      const pageItems = filtered.slice(startIdx, startIdx + pageSize);

      document.getElementById('total-raw-count').innerText = `${total.toLocaleString()} Files`;
      document.getElementById('raw-page-indicator').innerText = `Showing ${total > 0 ? startIdx + 1 : 0}-${Math.min(startIdx + pageSize, total)} of ${total.toLocaleString()}`;

      const tbody = document.getElementById('raw-tbody');
      if (pageItems.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:24px; color:#9ca3af;">No raw events match your search criteria</td></tr>`;
        return;
      }

      tbody.innerHTML = pageItems.map(item => `
        <tr>
          <td><span class="badge badge-server">${escapeHtml(item.category)}</span></td>
          <td>
            <span class="mono" style="color:#93c5fd; font-weight:500;">${escapeHtml(item.relativePath)}</span>
          </td>
          <td class="mono" style="font-size:11px;">${item.sizeBytes} B</td>
          <td class="mono" style="font-size:11px;">
            ${item.eventId ? `<span title="${item.eventId}">${item.eventId.slice(0, 12)}...</span>` : '<span class="text-muted">None</span>'}
          </td>
          <td class="mono" style="font-size:11px;">
            ${item.traceId ? `<a href="trace-detail.html?traceId=${item.traceId}">${item.traceId.slice(0, 10)}... ↗</a>` : '<span class="text-muted">None</span>'}
          </td>
          <td class="mono" style="font-size:11px;">
            ${item.spanId ? `<code>${item.spanId.slice(0, 10)}...</code>` : '<span class="text-muted">None</span>'}
          </td>
          <td>
            <button class="btn btn-secondary" style="padding:2px 8px; font-size:10px;" onclick="window.viewRawPayload('${escapeHtml(item.relativePath)}')">
              Inspect
            </button>
          </td>
        </tr>
      `).join('');
    }

    window.viewRawPayload = async (relPath) => {
      try {
        const modal = document.getElementById('raw-modal');
        const backdrop = document.getElementById('raw-modal-backdrop');
        document.getElementById('modal-filename').innerText = relPath.split('/').pop();
        document.getElementById('modal-path').innerText = relPath;
        document.getElementById('modal-payload').innerText = 'Loading file from server...';

        modal.style.display = 'flex';
        backdrop.classList.add('open');

        // Fetch raw file via server
        const res = await fetch(`/${relPath}`);
        if (res.ok) {
          const json = await res.json();
          document.getElementById('modal-payload').innerText = JSON.stringify(json, null, 2);
        } else {
          // Fallback from dataSlice
          const found = allManifest.find(m => m.relativePath === relPath);
          if (found) {
            document.getElementById('modal-payload').innerText = found.dataSlice + '\n... (truncated preview)';
          }
        }
      } catch (err) {
        console.error('Failed to fetch raw file:', err);
      }
    };

    function closeModal() {
      document.getElementById('raw-modal').style.display = 'none';
      document.getElementById('raw-modal-backdrop').classList.remove('open');
    }

    document.getElementById('btn-close-modal').onclick = closeModal;
    document.getElementById('raw-modal-backdrop').onclick = closeModal;
    document.getElementById('btn-copy-modal').onclick = (e) => {
      copyToClipboard(document.getElementById('modal-payload').innerText, e.target);
    };

    document.getElementById('raw-filter-search').addEventListener('input', () => { currentPage = 1; renderManifest(); });
    document.getElementById('raw-filter-cat').addEventListener('change', () => { currentPage = 1; renderManifest(); });

    document.getElementById('btn-raw-prev').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderManifest();
      }
    });

    document.getElementById('btn-raw-next').addEventListener('click', () => {
      currentPage++;
      renderManifest();
    });

    loadManifest();
  </script>
</body>
</html>
